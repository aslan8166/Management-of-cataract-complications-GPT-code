[project]
name = "ophthalmology-llm-temporal-validity"
version = "0.1.0"
description = "Arm 1 bibliometric engine: temporal validity of LLM-evaluation ophthalmology papers (PubMed)"
requires-python = ">=3.10"
# Core runtime deps (fetch + parse + extract + index). Kept light so the pilot
# venv installs fast. Heavy stats/plotting libs live in the optional 'analysis'
# group and are only needed for later stages (metrics.py / analysis.py).
dependencies = [
    "httpx>=0.27",
    "pandas>=2.0",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
analysis = [
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
]

[tool.setuptools]
packages = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
